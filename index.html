<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electric Meter Consumption Calculator</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>

    <!-- Fonts: Hepta Slab & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hepta+Slab:wght@1..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <!-- Lottie Player (Windmill & Sleepy Cat) -->
    <script src="https://unpkg.com/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs" type="module"></script>

    <!-- App Styles & Script -->
    <link href="css/index.css" rel="stylesheet">
    <script src="js/calculator.js" defer></script>
</head>

<body>

    <div class="row g-0" id="row">
        <!-- Left Half: Intro & Animation -->
        <div class="col-sm-5 position-relative" id="firsthalf">
            <div class="content" id="content">
                <h1 class="display1" id="txtheader">Track Your Electricity Usage</h1>
                <h2 class="display2" id="txtdesc">
                    Monitor your electricity consumption to save energy and reduce costs.
                </h2>

                <div class="animation-wrapper">
                    <dotlottie-player
                        src="https://lottie.host/89e2033a-066e-4f6e-9557-bcf00fdccd68/43iVGMV3fc.lottie"
                        background="transparent"
                        speed="1"
                        loop
                        autoplay>
                    </dotlottie-player>
                </div>
            </div>
        </div>

        <!-- Right Half: Calculator Form -->
        <div class="col-sm-7" id="secondhalf">
            <form id="calculatorform" novalidate>
                <div class="form-group mb-4">
                    <label for="meternum">Meter Number</label>
                    <input type="text" id="meternum" placeholder="Enter meter number (e.g. ABCD1234)" maxlength="8">
                    <small id="errorText1" class="form-text" role="alert"></small>
                </div>

                <hr>

                <div class="form-group mb-4">
                    <label for="prevreadinput">Previous Reading (kWh)</label>
                    <input type="number" id="prevreadinput" placeholder="Enter the previous reading" step="any">
                    <small id="errorText2" class="form-text" role="alert"></small>
                </div>

                <div class="form-group mb-4">
                    <label for="currentreadinput">Current Reading (kWh)</label>
                    <input type="number" id="currentreadinput" placeholder="Enter the current reading" step="any">
                    <small id="errorText3" class="form-text" role="alert"></small>
                </div>

                <div class="form-group mb-4">
                    <label for="costinput">Cost per kWh (PHP)</label>
                    <input type="number" id="costinput" placeholder="Enter the cost per kWh" step="any">
                    <small id="errorText4" class="form-text" role="alert"></small>
                </div>

                <hr>

                <div class="form-group mt-4">
                    <button type="submit" id="btn">Calculate!</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Loading Screen Overlay -->
    <div id="loadingscreen">
        <!-- Loading Screen Background -->
        <div class="row g-0" id="backgroundRow">
            <div class="col-sm-5" id="loadingFirsthalf"></div>
            <div class="col-sm-7" id="loadingSecondhalf"></div>
        </div>

        <!-- Loading Screen Content -->
        <div id="loadingText">
            <h1 class="display1" id="calculatingtxt">CALCULATING...</h1>

            <div class="animation-wrapper2">
                <dotlottie-player
                    src="https://lottie.host/045bcbb4-383f-4315-a1e2-3891eb20a222/lYfbDDjHYx.lottie"
                    background="transparent"
                    speed="1"
                    style="width: 500px; height: 500px"
                    loop
                    autoplay>
                </dotlottie-player>
            </div>
        </div>
    </div>

</body>

</html>
